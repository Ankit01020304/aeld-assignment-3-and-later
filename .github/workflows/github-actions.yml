name: assignment-test
on:
    push:
        tags-ignore:
            - '*'
        branches:
            - '*'
jobs:
    unit-test:
        container: cuaesd/aesd-autotest:24-unit-test
        runs-on: self-hosted
        steps:
          - uses: actions/checkout@v2
          - name: Checkout submodules
            run : git submodule update --init --recursive
          - name: Run unit test
            run: ./unit-test.sh
    full-test:
        container: cuaesd/aesd-autotest:24-assignment3
        runs-on: self-hosted
        steps:
          - uses: actions/checkout@v2
          - name: Checkout submodules
            run : git submodule update --init --recursive
          - name: Debug assignment3 container
            run: | 
              whoami  
              pwd    
              env | sort
              which aarch64-linux-gnu-gcc || echo "NOT FOUND"
              ls -l /usr/bin/aarch64-linux-gnu-gcc || echo "NO FILE"
              type aarch64-linux-gnu-gcc || true
          - name: Run full test
            run: ./full-test.sh
